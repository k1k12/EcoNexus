name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# The checks only need to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Throwaway values so the app can start in CI. Not used anywhere live.
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-only-not-a-real-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CORS_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install the backend
        working-directory: backend
        run: pip install -e .[dev]
      - name: Backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q tests/pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the frontend
        working-directory: frontend
        run: npm ci
      - name: Build the website
        working-directory: frontend
        run: npx expo export --platform web --clear
