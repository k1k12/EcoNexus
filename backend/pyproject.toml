[project]
name = "econexus-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
  "fastapi",
  "httpx",
  "gunicorn",
  "uvicorn[standard]",
  "sqlalchemy",
  "sqlalchemy_utils",
  "psycopg2-binary",
  "python-jose",
  "passlib[bcrypt]",
  "rapidfuzz",
  "python-multipart",
  "pydantic",
  "alembic",
  "lxml",
  "python-dotenv",
  "asyncpg",
  "pydantic_settings",
  "pydantic[email]",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<8.0",
  "pytest-asyncio",
  "pytest-cov",
  "bandit",
  "locust",
  "aiosqlite>=0.18,<0.19",
  "respx>=0.20.0,<0.21.0",
  "black",
  "respx[httpx]>=0.20.0,<0.21.0",
]


[tool.setuptools.packages.find]
where = ["src"]
