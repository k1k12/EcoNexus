# Local development only. Put POSTGRES_PASSWORD in a .env file next to this one.
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: econexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d econexus"]
      interval: 2s
      retries: 15

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: econexus-migrations
    volumes:
      - ./backend:/src
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/econexus
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python tests/manual/db/populate_tables.py"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: econexus-backend
    volumes:
      - ./backend:/src
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/econexus
    depends_on:
      migrations:
        condition: service_completed_successfully
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    command: bash -c "npm install && npm start"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: econexus-frontend
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:8081:8081"
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  postgres_data:
